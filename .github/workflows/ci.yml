name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install
        continue-on-error: true

      - name: Placeholder — lint / typecheck / test
        run: |
          echo "CI foundation is in place."
          echo "Lint, typecheck and test scripts will be wired as packages mature."
